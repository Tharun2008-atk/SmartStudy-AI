{% extends "base.html" %}

{% block title %}Error - SmartStudy AI{% endblock %}

{% block content %}

<div class="tool-page">

    <div class="tool-header">

        <div class="tool-icon">
            ⚠️
        </div>

        <h1>Something went wrong</h1>

        <p>
            SmartStudy AI couldn't complete your request.
            Please try again.
        </p>

    </div>

    <div class="tool-card" style="text-align:center;">

        <h2>{{ error_message }}</h2>

        <br>

        <a href="{{ url_for('home') }}" class="tool-button">
            🏠 Back to Home
        </a>

    </div>

</div>

{% endblock %}
